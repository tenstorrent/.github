name: Test vault-secrets action

# Tests actions/vault-secrets from this checkout (uses: ./actions/vault-secrets),
# so a pull request tests its own code.
#
# Jobs that log in to Vault use the environment vault-action-test and need the
# Vault grant for this repository (github-vault-iac, grants/repos/tenstorrent/.github.yaml):
#   role   tenstorrent--.github--vault-action-test
#          environment vault-action-test, events pull_request + workflow_dispatch
#   token  tenstorrent--.github--contents-read (contents read, metadata read; this repo only)
#   kv     kv/data/_roles/tenstorrent--.github--vault-action-test/test, field `value`
# They run only when the repository variable VAULT_SECRETS_TEST_ENABLED is 'true'.
# Set it after the grant is applied and the environment exists. Until then they
# are skipped, and a run does not create the environment.
#
# Fork pull requests get no OIDC token, so every job that needs one is skipped
# for them.
#
# Security of this test
# ---------------------
# The Vault jobs run code from the pull request: the action, the test scripts
# and this file. A pull request from a branch in this repository can change
# that code, so it can read what the test role can read. A check in this file
# cannot stop that, because the pull request can also change this file.
# These controls limit the risk:
#   1. The test role is narrow: one read-only token for this public repository
#      and one dummy KV value. The test role must never get a token with write
#      access or a real secret.
#   2. REQUIRED: the environment vault-action-test has required reviewers.
#      A person reads the diff and approves before a Vault job starts. The role
#      accepts only that environment, so a job without it cannot log in.
#   3. Fork pull requests get no OIDC token and cannot log in.
# Jobs without the environment cannot log in with the test role. They use no
# Vault value and no secret.

on:
  pull_request:
    paths:
      - "actions/vault-secrets/**"
      - ".github/workflows/vault-secrets-test.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: vault-secrets-test-${{ github.ref }}
  cancel-in-progress: true

env:
  VAULT_URL: https://vault-ospo.eng-svc.aws.tenstorrent.com
  VAULT_ROLE: tenstorrent--.github--vault-action-test
  VAULT_TOKEN_NAME: tenstorrent--.github--contents-read
  VAULT_KV_PATH: kv/data/_roles/tenstorrent--.github--vault-action-test/test
  VAULT_KV_FIELD: value

jobs:
  # ── Success ────────────────────────────────────────────────────────────────

  token-only:
    if: >-
      vars.VAULT_SECRETS_TEST_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: vault-action-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: vault
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          github-token: ${{ env.VAULT_TOKEN_NAME }}

      - name: Assert the time limit watched the Vault step
        env:
          EXPECT_COUNT: "1"
        run: bash actions/vault-secrets/test/assert-attached.sh

      - name: Check the token works and is not the job token
        env:
          APP_TOKEN: ${{ steps.vault.outputs.token }}
          JOB_TOKEN: ${{ github.token }}
          EXPECTED: ${{ github.repository }}
          FAILED_STEP: ${{ steps.vault.outputs.failed-step }}
        run: |
          set -euo pipefail
          [ -z "$FAILED_STEP" ] || { echo "::error::output failed-step is '$FAILED_STEP', expected empty"; exit 1; }
          [ -n "$APP_TOKEN" ] || { echo "::error::output token is empty"; exit 1; }
          [ "$APP_TOKEN" != "$JOB_TOKEN" ] || { echo "::error::output token is the job GITHUB_TOKEN"; exit 1; }
          case "$APP_TOKEN" in
            ghs_*) ;;
            *) echo "::error::output token is not a GitHub App installation token"; exit 1 ;;
          esac
          name="$(GH_TOKEN="$APP_TOKEN" gh api "repos/$EXPECTED" --jq .full_name)"
          [ "$name" = "$EXPECTED" ] || { echo "::error::token read '$name', expected '$EXPECTED'"; exit 1; }
          echo "OK: the token reads $name."

  token-and-kv:
    if: >-
      vars.VAULT_SECRETS_TEST_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: vault-action-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: vault
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          github-token: ${{ env.VAULT_TOKEN_NAME }}
          secrets: |
            ${{ env.VAULT_KV_PATH }} ${{ env.VAULT_KV_FIELD }} | KV_TEST

      - name: Assert the time limit watched the Vault step
        env:
          EXPECT_COUNT: "1"
        run: bash actions/vault-secrets/test/assert-attached.sh

      # Prints lengths and key names only, never a value.
      - name: Check both outputs
        env:
          APP_TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS_JSON: ${{ steps.vault.outputs.secrets }}
          KV_TEST: ${{ fromJSON(steps.vault.outputs.secrets).KV_TEST }}
        run: |
          set -euo pipefail
          [ -n "$APP_TOKEN" ] || { echo "::error::output token is empty"; exit 1; }
          printf '%s' "$SECRETS_JSON" | jq -e 'has("KV_TEST") and has("VAULT_SECRETS_GITHUB_TOKEN")' >/dev/null \
            || { echo "::error::output secrets lacks KV_TEST or VAULT_SECRETS_GITHUB_TOKEN"; exit 1; }
          echo "Keys in output secrets: $(printf '%s' "$SECRETS_JSON" | jq -r 'keys | join(", ")')"
          [ -n "$KV_TEST" ] || { echo "::error::KV_TEST is empty"; exit 1; }
          echo "OK: KV_TEST has ${#KV_TEST} characters."

  two-calls:
    if: >-
      vars.VAULT_SECRETS_TEST_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: vault-action-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: first
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          github-token: ${{ env.VAULT_TOKEN_NAME }}

      - name: Record the tailnet node
        id: node
        run: |
          set -euo pipefail
          printf 'id=%s\n' "$(tailscale status --json | jq -r '.Self.ID')" >>"$GITHUB_OUTPUT"

      # join-tailnet stays auto: the action must see the runner is on the
      # tailnet and skip the second join.
      - id: second
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          secrets: |
            ${{ env.VAULT_KV_PATH }} ${{ env.VAULT_KV_FIELD }} | KV_TEST

      - name: Assert the time limit watched the Vault step
        env:
          EXPECT_COUNT: "2"
        run: bash actions/vault-secrets/test/assert-attached.sh

      - name: Check both calls and that the second did not join again
        env:
          FIRST_TOKEN: ${{ steps.first.outputs.token }}
          KV_TEST: ${{ fromJSON(steps.second.outputs.secrets).KV_TEST }}
          NODE_BEFORE: ${{ steps.node.outputs.id }}
        run: |
          set -euo pipefail
          [ -n "$FIRST_TOKEN" ] || { echo "::error::first call: output token is empty"; exit 1; }
          [ -n "$KV_TEST" ] || { echo "::error::second call: KV_TEST is empty"; exit 1; }
          after="$(tailscale status --json | jq -r '.Self.ID')"
          [ "$after" = "$NODE_BEFORE" ] || { echo "::error::the tailnet node changed: the second call joined again"; exit 1; }
          echo "OK: two calls, one tailnet node."

  # Runs prepare.sh, wait-for-vault.sh and watchdog.sh directly: no Vault, no
  # OIDC token, no secret. Checks that each pre-check refuses its case with its
  # own message, that the reserved output name is refused only as an output
  # name, that wait-for-vault.sh fails with its message when Vault cannot be
  # reached, and that the time limit of the Vault step stops only its own
  # target and fails with its message.
  precheck-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash actions/vault-secrets/test/prepare-cases.sh
      - run: bash actions/vault-secrets/test/wait-cases.sh
      - run: bash actions/vault-secrets/test/watchdog-cases.sh

  # ── Failure ────────────────────────────────────────────────────────────────
  # Each case runs the action with continue-on-error, then asserts that the
  # action step failed in the expected step of the action (output failed-step)
  # and that both outputs are empty. The job fails if the action succeeds or
  # fails in another step. The precheck-rules job checks the message of each
  # pre-check and of the Vault wait. For the Vault step, only the step is
  # checked: the caller cannot see the Vault error message.

  # Fail in the pre-checks, before any network call. No grant needed.
  fails-precheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        case: [no-inputs, empty-role, bad-token-name, bad-join-value, http-url, other-host-url, url-with-path, url-with-port, reserved-output-name, reserved-default-name]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: case
        env:
          CASE: ${{ matrix.case }}
        run: bash actions/vault-secrets/test/case-inputs.sh
      - id: vault
        continue-on-error: true
        uses: ./actions/vault-secrets
        with:
          role: ${{ steps.case.outputs.role }}
          github-token: ${{ steps.case.outputs.github-token }}
          secrets: ${{ steps.case.outputs.secrets }}
          vault-url: ${{ steps.case.outputs.vault-url }}
          join-tailnet: ${{ steps.case.outputs.join-tailnet }}
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.vault.outcome }}
          TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS: ${{ steps.vault.outputs.secrets }}
          FAILED_STEP: ${{ steps.vault.outputs.failed-step }}
          EXPECT_STEP: prepare
        run: bash actions/vault-secrets/test/assert-failed.sh

  # Fail before the Vault login: Vault cannot be reached. No grant needed.
  fails-network:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        case: [no-tailnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: case
        env:
          CASE: ${{ matrix.case }}
        run: bash actions/vault-secrets/test/case-inputs.sh
      - id: vault
        continue-on-error: true
        uses: ./actions/vault-secrets
        with:
          role: ${{ steps.case.outputs.role }}
          github-token: ${{ steps.case.outputs.github-token }}
          secrets: ${{ steps.case.outputs.secrets }}
          vault-url: ${{ steps.case.outputs.vault-url }}
          join-tailnet: ${{ steps.case.outputs.join-tailnet }}
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.vault.outcome }}
          TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS: ${{ steps.vault.outputs.secrets }}
          FAILED_STEP: ${{ steps.vault.outputs.failed-step }}
          EXPECT_STEP: wait
        run: bash actions/vault-secrets/test/assert-failed.sh

  # No id-token: write. Fails in the pre-checks. No grant needed.
  fails-without-id-token:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vault
        continue-on-error: true
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          github-token: ${{ env.VAULT_TOKEN_NAME }}
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.vault.outcome }}
          TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS: ${{ steps.vault.outputs.secrets }}
          FAILED_STEP: ${{ steps.vault.outputs.failed-step }}
          EXPECT_STEP: prepare
        run: bash actions/vault-secrets/test/assert-failed.sh

  # Vault refuses. Only meaningful once the grant exists: without it every
  # login fails, so these would pass for the wrong reason.
  fails-vault-denied:
    if: >-
      vars.VAULT_SECRETS_TEST_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: vault-action-test
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        case: [wrong-role, wrong-token, wrong-kv-path, wrong-kv-field]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: case
        env:
          CASE: ${{ matrix.case }}
        run: bash actions/vault-secrets/test/case-inputs.sh
      - id: vault
        continue-on-error: true
        uses: ./actions/vault-secrets
        with:
          role: ${{ steps.case.outputs.role }}
          github-token: ${{ steps.case.outputs.github-token }}
          secrets: ${{ steps.case.outputs.secrets }}
          vault-url: ${{ steps.case.outputs.vault-url }}
          join-tailnet: ${{ steps.case.outputs.join-tailnet }}
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.vault.outcome }}
          TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS: ${{ steps.vault.outputs.secrets }}
          FAILED_STEP: ${{ steps.vault.outputs.failed-step }}
          EXPECT_STEP: vault
        run: bash actions/vault-secrets/test/assert-failed.sh

  # No environment: the JWT has no environment claim, so the role (bound to
  # environment vault-action-test) refuses the login.
  fails-without-environment:
    if: >-
      vars.VAULT_SECRETS_TEST_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vault
        continue-on-error: true
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          github-token: ${{ env.VAULT_TOKEN_NAME }}
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.vault.outcome }}
          TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS: ${{ steps.vault.outputs.secrets }}
          FAILED_STEP: ${{ steps.vault.outputs.failed-step }}
          EXPECT_STEP: vault
        run: bash actions/vault-secrets/test/assert-failed.sh
      # Needs no approval, and vault-action really starts here (Vault refuses
      # the login after less than a second). Proves that the time limit finds
      # the real vault-action process on a hosted runner.
      - name: Assert the time limit watched the Vault step
        env:
          EXPECT_COUNT: "1"
        run: bash actions/vault-secrets/test/assert-attached.sh

  # No live credentials or OIDC grant. These jobs run the actual composite and
  # pinned Vault action through a loopback CONNECT proxy and trusted test CA.
  userspace-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container: ['', 'ubuntu:24.04']
        oidc-route: [direct, corporate-proxy]
    env:
      OIDC_ROUTE: ${{ matrix.oidc-route }}
    steps:
      - name: Install container test tools
        if: matrix.container != ''
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl jq python3 openssl procps git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start local fake Vault and OIDC services
        id: fixture
        run: python3 actions/vault-secrets/test/proxy/fixture.py start
      - name: Retrieve token and KV through userspace proxy
        id: proxied
        uses: ./actions/vault-secrets
        with:
          role: proxy-test
          github-token: proxy-test
          secrets: |
            kv/data/proxy-test value | KV_TEST ;
            kv/data/proxy-test nested.value | NESTED ;
            kv/data/proxy-test multiline | MULTILINE
          vault-url: https://vault-ospo-staging.eng-svc.aws.tenstorrent.com
          join-tailnet: 'false'
          network-mode: userspace
          proxy-port: ${{ steps.fixture.outputs.port }}
      - name: Verify token, selectors, multiline values, and masking outputs
        env:
          APP_TOKEN: ${{ steps.proxied.outputs.token }}
          VALUES: ${{ steps.proxied.outputs.secrets }}
          FAILED_STEP: ${{ steps.proxied.outputs.failed-step }}
        run: |
          test "$APP_TOKEN" = fake-github-token
          test -z "$FAILED_STEP"
          printf '%s' "$VALUES" | jq -e '.KV_TEST == "fake-kv-value" and .NESTED == "fake-nested-value" and .MULTILINE == "fake-first\nfake-second"' >/dev/null
          test -z "${VAULT_TOKEN:-}"
      - name: Make the fixture refuse login
        run: python3 actions/vault-secrets/test/proxy/fixture.py deny
      - name: Verify denied login still fails normally through proxy
        id: denied
        continue-on-error: true
        uses: ./actions/vault-secrets
        with:
          role: proxy-test
          github-token: proxy-test
          vault-url: https://vault-ospo-staging.eng-svc.aws.tenstorrent.com
          join-tailnet: 'false'
          network-mode: userspace
          proxy-port: ${{ steps.fixture.outputs.port }}
      - name: Assert failure diagnostics and empty outputs
        env:
          OUTCOME: ${{ steps.denied.outcome }}
          TOKEN: ${{ steps.denied.outputs.token }}
          SECRETS: ${{ steps.denied.outputs.secrets }}
          FAILED_STEP: ${{ steps.denied.outputs.failed-step }}
        run: |
          test "$OUTCOME" = failure
          test "$FAILED_STEP" = vault
          test -z "$TOKEN"
          test "$SECRETS" = '{}'
      - name: Verify routing and step-local proxy overrides
        run: python3 actions/vault-secrets/test/proxy/fixture.py verify
      - name: Confirm the watchdog monitored both Vault calls
        env:
          EXPECT_COUNT: '2'
        run: bash actions/vault-secrets/test/assert-attached.sh
      - name: Stop fixture
        if: always()
        run: python3 actions/vault-secrets/test/proxy/fixture.py stop
