name: Test vault-secrets action

# Tests actions/vault-secrets from this checkout (uses: ./actions/vault-secrets),
# so a pull request tests its own code.
#
# Jobs that log in to Vault use the environment vault-action-test and need the
# Vault grant for this repository (github-vault-iac, grants/repos/tenstorrent/.github.yaml):
#   role   tenstorrent--.github--vault-action-test
#          environment vault-action-test, events pull_request + workflow_dispatch
#   token  tenstorrent--.github--contents-read (contents read, metadata read; this repo only)
#   kv     kv/data/_roles/tenstorrent--.github--vault-action-test/test, field `value`
# They run only when the repository variable VAULT_SECRETS_TEST_ENABLED is 'true'.
# Set it after the grant is applied and the environment exists. Until then they
# are skipped, and a run does not create the environment.
#
# Fork pull requests get no OIDC token, so every job that needs one is skipped
# for them.

on:
  pull_request:
    paths:
      - "actions/vault-secrets/**"
      - ".github/workflows/vault-secrets-test.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: vault-secrets-test-${{ github.ref }}
  cancel-in-progress: true

env:
  VAULT_URL: https://vault-ospo.eng-svc.aws.tenstorrent.com
  VAULT_ROLE: tenstorrent--.github--vault-action-test
  VAULT_TOKEN_NAME: tenstorrent--.github--contents-read
  VAULT_KV_PATH: kv/data/_roles/tenstorrent--.github--vault-action-test/test
  VAULT_KV_FIELD: value

jobs:
  # ── Success ────────────────────────────────────────────────────────────────

  token-only:
    if: >-
      vars.VAULT_SECRETS_TEST_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: vault-action-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: vault
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          github-token: ${{ env.VAULT_TOKEN_NAME }}

      - name: Check the token works and is not the job token
        env:
          APP_TOKEN: ${{ steps.vault.outputs.token }}
          JOB_TOKEN: ${{ github.token }}
          EXPECTED: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "$APP_TOKEN" ] || { echo "::error::output token is empty"; exit 1; }
          [ "$APP_TOKEN" != "$JOB_TOKEN" ] || { echo "::error::output token is the job GITHUB_TOKEN"; exit 1; }
          case "$APP_TOKEN" in
            ghs_*) ;;
            *) echo "::error::output token is not a GitHub App installation token"; exit 1 ;;
          esac
          name="$(GH_TOKEN="$APP_TOKEN" gh api "repos/$EXPECTED" --jq .full_name)"
          [ "$name" = "$EXPECTED" ] || { echo "::error::token read '$name', expected '$EXPECTED'"; exit 1; }
          echo "OK: the token reads $name."

  token-and-kv:
    if: >-
      vars.VAULT_SECRETS_TEST_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: vault-action-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: vault
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          github-token: ${{ env.VAULT_TOKEN_NAME }}
          secrets: |
            ${{ env.VAULT_KV_PATH }} ${{ env.VAULT_KV_FIELD }} | KV_TEST

      # Prints lengths and key names only, never a value.
      - name: Check both outputs
        env:
          APP_TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS_JSON: ${{ steps.vault.outputs.secrets }}
          KV_TEST: ${{ fromJSON(steps.vault.outputs.secrets).KV_TEST }}
        run: |
          set -euo pipefail
          [ -n "$APP_TOKEN" ] || { echo "::error::output token is empty"; exit 1; }
          printf '%s' "$SECRETS_JSON" | jq -e 'has("KV_TEST") and has("VAULT_SECRETS_GITHUB_TOKEN")' >/dev/null \
            || { echo "::error::output secrets lacks KV_TEST or VAULT_SECRETS_GITHUB_TOKEN"; exit 1; }
          echo "Keys in output secrets: $(printf '%s' "$SECRETS_JSON" | jq -r 'keys | join(", ")')"
          [ -n "$KV_TEST" ] || { echo "::error::KV_TEST is empty"; exit 1; }
          echo "OK: KV_TEST has ${#KV_TEST} characters."

  two-calls:
    if: >-
      vars.VAULT_SECRETS_TEST_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: vault-action-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: first
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          github-token: ${{ env.VAULT_TOKEN_NAME }}

      - name: Record the tailnet node
        id: node
        run: |
          set -euo pipefail
          printf 'id=%s\n' "$(tailscale status --json | jq -r '.Self.ID')" >>"$GITHUB_OUTPUT"

      # join-tailnet stays auto: the action must see the runner is on the
      # tailnet and skip the second join.
      - id: second
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          secrets: |
            ${{ env.VAULT_KV_PATH }} ${{ env.VAULT_KV_FIELD }} | KV_TEST

      - name: Check both calls and that the second did not join again
        env:
          FIRST_TOKEN: ${{ steps.first.outputs.token }}
          KV_TEST: ${{ fromJSON(steps.second.outputs.secrets).KV_TEST }}
          NODE_BEFORE: ${{ steps.node.outputs.id }}
        run: |
          set -euo pipefail
          [ -n "$FIRST_TOKEN" ] || { echo "::error::first call: output token is empty"; exit 1; }
          [ -n "$KV_TEST" ] || { echo "::error::second call: KV_TEST is empty"; exit 1; }
          after="$(tailscale status --json | jq -r '.Self.ID')"
          [ "$after" = "$NODE_BEFORE" ] || { echo "::error::the tailnet node changed: the second call joined again"; exit 1; }
          echo "OK: two calls, one tailnet node."

  # ── Failure ────────────────────────────────────────────────────────────────
  # Each case runs the action with continue-on-error, then asserts that the
  # action step failed and both outputs are empty. The job fails if the action
  # succeeds.

  # Fail in the pre-checks, before any network call. No grant needed.
  fails-precheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        case: [no-inputs, empty-role, bad-token-name, bad-join-value, http-url, reserved-output-name]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: case
        env:
          CASE: ${{ matrix.case }}
        run: bash actions/vault-secrets/test/case-inputs.sh
      - id: vault
        continue-on-error: true
        uses: ./actions/vault-secrets
        with:
          role: ${{ steps.case.outputs.role }}
          github-token: ${{ steps.case.outputs.github-token }}
          secrets: ${{ steps.case.outputs.secrets }}
          vault-url: ${{ steps.case.outputs.vault-url }}
          join-tailnet: ${{ steps.case.outputs.join-tailnet }}
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.vault.outcome }}
          TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS: ${{ steps.vault.outputs.secrets }}
        run: bash actions/vault-secrets/test/assert-failed.sh

  # Fail before the Vault login: Vault cannot be reached. No grant needed.
  fails-network:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        case: [unreachable-url, no-tailnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: case
        env:
          CASE: ${{ matrix.case }}
        run: bash actions/vault-secrets/test/case-inputs.sh
      - id: vault
        continue-on-error: true
        uses: ./actions/vault-secrets
        with:
          role: ${{ steps.case.outputs.role }}
          github-token: ${{ steps.case.outputs.github-token }}
          secrets: ${{ steps.case.outputs.secrets }}
          vault-url: ${{ steps.case.outputs.vault-url }}
          join-tailnet: ${{ steps.case.outputs.join-tailnet }}
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.vault.outcome }}
          TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS: ${{ steps.vault.outputs.secrets }}
        run: bash actions/vault-secrets/test/assert-failed.sh

  # No id-token: write. Fails in the pre-checks. No grant needed.
  fails-without-id-token:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vault
        continue-on-error: true
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          github-token: ${{ env.VAULT_TOKEN_NAME }}
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.vault.outcome }}
          TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS: ${{ steps.vault.outputs.secrets }}
        run: bash actions/vault-secrets/test/assert-failed.sh

  # Vault refuses. Only meaningful once the grant exists: without it every
  # login fails, so these would pass for the wrong reason.
  fails-vault-denied:
    if: >-
      vars.VAULT_SECRETS_TEST_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: vault-action-test
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        case: [wrong-role, wrong-token, wrong-kv-path, wrong-kv-field]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: case
        env:
          CASE: ${{ matrix.case }}
        run: bash actions/vault-secrets/test/case-inputs.sh
      - id: vault
        continue-on-error: true
        uses: ./actions/vault-secrets
        with:
          role: ${{ steps.case.outputs.role }}
          github-token: ${{ steps.case.outputs.github-token }}
          secrets: ${{ steps.case.outputs.secrets }}
          vault-url: ${{ steps.case.outputs.vault-url }}
          join-tailnet: ${{ steps.case.outputs.join-tailnet }}
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.vault.outcome }}
          TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS: ${{ steps.vault.outputs.secrets }}
        run: bash actions/vault-secrets/test/assert-failed.sh

  # No environment: the JWT has no environment claim, so the role (bound to
  # environment vault-action-test) refuses the login.
  fails-without-environment:
    if: >-
      vars.VAULT_SECRETS_TEST_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vault
        continue-on-error: true
        uses: ./actions/vault-secrets
        with:
          role: ${{ env.VAULT_ROLE }}
          github-token: ${{ env.VAULT_TOKEN_NAME }}
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.vault.outcome }}
          TOKEN: ${{ steps.vault.outputs.token }}
          SECRETS: ${{ steps.vault.outputs.secrets }}
        run: bash actions/vault-secrets/test/assert-failed.sh
