name: OSPO Vault secrets
description: >-
  Joins the tailnet if needed, logs in to OSPO Vault with the job's GitHub OIDC
  token, and gets an ephemeral GitHub token and/or Vault secrets.
  The job needs `permissions: id-token: write`. See README.md.

inputs:
  role:
    description: >-
      Vault role of this workflow (jwt-github). Empty: the default role `<org>--<repo>`
      of this repository (lower case). A short name such as `nightly`: `<org>--<repo>--nightly`.
      A full name `<org>--<repo>--<name>` is used as is (lower case).
    required: false
    default: ""
  github-token:
    description: >-
      Key of a GitHub token in the grant of this repository, for example
      `contents-read`. The action reads token set `<org>--<repo>--<key>` (lower
      case) and finds where Vault keeps it. A full name `<org>--<repo>--<key>`
      also works. A name of another repository is refused. Still accepted (1.0
      form): a value with `/` is a full Vault path and is read as is.
      The token goes to output `token`.
    required: false
    default: ""
  secrets:
    description: >-
      Secrets to read, in hashicorp/vault-action `secrets` syntax
      (`<path> <field> | <NAME> ;` per line). The values go to output `secrets` (JSON).
    required: false
    default: ""
  vault-url:
    description: >-
      Vault URL. Only the OSPO Vault production URL (default) and the staging URL
      are allowed. The JWT audience is always this URL.
    required: false
    default: https://vault-ospo.eng-svc.aws.tenstorrent.com
  join-tailnet:
    description: >-
      `auto`: join the tailnet unless the runner is already on it.
      `true`: always join. `false`: never join.
    required: false
    default: auto
  network-mode:
    description: >-
      Since release 1.2. `kernel` (default): the runner reaches Vault through its
      own routes, as in 1.1. `userspace`: for Linux runner pods without /dev/net/tun
      or NET_ADMIN. Tailscale runs in userspace mode, and all Vault requests go
      through its loopback proxy on `proxy-port`. The GitHub OIDC request keeps the
      runner's own proxy settings. Needs a Linux runner with Node 24.5 or newer.
    required: false
    default: kernel
  proxy-port:
    description: >-
      Since release 1.2. Port of the Tailscale HTTP proxy on 127.0.0.1 in
      `userspace` mode (1 to 65535). Not used in `kernel` mode.
    required: false
    default: "1055"
  tailscale-client-id:
    description: >-
      Tailscale OAuth client ID for workload identity federation. Not a secret.
      The default is the org variable TS_VAULT_OSPO_CLIENT_ID (same value in all six orgs).
    required: false
    default: T3ZY7MLEet11CNTRL-kf8wcW3CAv11CNTRL
  tailscale-audience:
    description: >-
      Tailscale OIDC audience. Not a secret.
      The default is the org variable TS_VAULT_OSPO_AUDIENCE (same value in all six orgs).
    required: false
    default: tailscale-gha-vault-ospo
  tailscale-tags:
    description: Tailscale tags for the runner node.
    required: false
    default: tag:tt-gha-vault-ospo
  vault-timeout-seconds:
    description: >-
      Time limit of the Vault read, in seconds (10 to 600). After this time the
      action stops the Vault step and fails with failed-step `vault`. Each request
      of the Vault login has its own limit of 15 seconds; the OIDC token request
      is tried up to 3 times.
      The read of a github-token without `/` is not under this limit: it sends
      at most 3 requests of 15 seconds each.
    required: false
    default: "120"

outputs:
  token:
    description: The GitHub token from `github-token`. Empty when `github-token` is not set or the action failed. Masked in logs.
    value: ${{ steps.check.outcome == 'success' && (steps.token.outputs.token || steps.vault.outputs.VAULT_SECRETS_GITHUB_TOKEN) || '' }}
  secrets:
    description: >-
      JSON object with one key per name in `secrets`. When `github-token` is set,
      it also has the key VAULT_SECRETS_GITHUB_TOKEN. `{}` when the action failed.
      Read a value with `fromJSON(steps.<id>.outputs.secrets).<NAME>`. Values are masked in logs.
    value: ${{ steps.check.outcome == 'success' && steps.check.outputs.secrets || '{}' }}
  failed-step:
    description: >-
      The step of the action that failed: `prepare`, `join`, `wait`, `vault` or `check`.
      Empty when the action succeeds. The runner sets composite outputs also when a step fails.
    value: >-
      ${{
        steps.prepare.outcome == 'failure' && 'prepare' ||
        steps.join.outcome == 'failure' && 'join' ||
        steps.wait.outcome == 'failure' && 'wait' ||
        steps.login.outcome == 'failure' && 'vault' ||
        steps.token.outcome == 'failure' && 'vault' ||
        steps.watchdog.outcome == 'failure' && 'vault' ||
        steps.vault.outcome == 'failure' && 'vault' ||
        steps.watchdog_stop.outcome == 'failure' && 'vault' ||
        steps.check.outcome == 'failure' && 'check' || ''
      }}

runs:
  using: composite
  steps:
    - name: Check inputs and job
      id: prepare
      shell: bash
      env:
        IN_ROLE: ${{ inputs.role }}
        IN_GITHUB_TOKEN: ${{ inputs.github-token }}
        IN_SECRETS: ${{ inputs.secrets }}
        IN_VAULT_URL: ${{ inputs.vault-url }}
        IN_JOIN_TAILNET: ${{ inputs.join-tailnet }}
        IN_NETWORK_MODE: ${{ inputs.network-mode }}
        IN_PROXY_PORT: ${{ inputs.proxy-port }}
        IN_TS_CLIENT_ID: ${{ inputs.tailscale-client-id }}
        IN_TS_AUDIENCE: ${{ inputs.tailscale-audience }}
        IN_TS_TAGS: ${{ inputs.tailscale-tags }}
        IN_VAULT_TIMEOUT: ${{ inputs.vault-timeout-seconds }}
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
      run: bash "$GITHUB_ACTION_PATH/prepare.sh"

    # Do not pass `args: --accept-routes`: the action sets it, and a second copy fails.
    - name: Join tailnet
      id: join
      if: steps.prepare.outputs.join == 'true'
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        audience: ${{ inputs.tailscale-audience }}
        tags: ${{ inputs.tailscale-tags }}
        tailscaled-args: ${{ steps.prepare.outputs.tailscaled-args }}

    - name: Wait for Vault
      id: wait
      shell: bash
      env:
        VAULT_URL: ${{ steps.prepare.outputs.url }}
        VAULT_PROXY: ${{ steps.prepare.outputs.proxy-url }}
      run: bash "$GITHUB_ACTION_PATH/wait-for-vault.sh"

    # login.sh masks the OIDC JWT and the Vault token at once. The Vault token
    # goes to the step output vault-token, which only the token and read steps below use.
    # No composite output exposes it. Each request has a limit of 15 seconds;
    # the OIDC token request is tried up to 3 times, the Vault login one time.
    - name: Log in to Vault
      id: login
      shell: bash
      env:
        VAULT_URL: ${{ steps.prepare.outputs.url }}
        ROLE: ${{ steps.prepare.outputs.role }}
        ROLE_SOURCE: ${{ steps.prepare.outputs.role-source }}
        ROLE_INPUT: ${{ inputs.role }}
        PREFIX: ${{ steps.prepare.outputs.prefix }}
        REPOSITORY: ${{ github.repository }}
        VAULT_PROXY: ${{ steps.prepare.outputs.proxy-url }}
      run: bash "$GITHUB_ACTION_PATH/login.sh"

    # Only for github-token without '/': finds the engine of the token set and
    # reads the token, one request per engine, 15 seconds each, no retry. The
    # first success is the token: vault-action does not read it again. Masks the
    # token at once. See read-token.sh.
    - name: Get GitHub token from Vault
      id: token
      if: steps.prepare.outputs.token-set != ''
      shell: bash
      env:
        VAULT_URL: ${{ steps.prepare.outputs.url }}
        VAULT_TOKEN: ${{ steps.login.outputs.vault-token }}
        TOKEN_SET: ${{ steps.prepare.outputs.token-set }}
        TOKEN_INPUT: ${{ inputs.github-token }}
        ROLE: ${{ steps.prepare.outputs.role }}
        REPOSITORY: ${{ github.repository }}
        VAULT_PROXY: ${{ steps.prepare.outputs.proxy-url }}
      run: bash "$GITHUB_ACTION_PATH/read-token.sh"

    # Composite steps cannot have timeout-minutes, and vault-action has no
    # request timeout. A background watchdog stops the Vault step at the limit.
    # The watchdog and the read step run only when there is something for
    # vault-action to read (secrets, or github-token with '/').
    - name: Start time limit for Vault
      id: watchdog
      if: steps.prepare.outputs.spec != ''
      shell: bash
      env:
        VAULT_TIMEOUT: ${{ steps.prepare.outputs.vault-timeout }}
      run: bash "$GITHUB_ACTION_PATH/watchdog.sh" start

    # vault-action masks every value it reads (core.setSecret, per line).
    # It uses the Vault token from the login step as is (method token: no login,
    # no lookup).
    - name: Read from Vault
      id: vault
      if: steps.prepare.outputs.spec != ''
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      # Empty in kernel mode: the runner's environment is not changed.
      # In userspace mode: a Node preload (proxy-agent.cjs) sends the Vault
      # requests of this step through the Tailscale loopback proxy.
      env: ${{ fromJSON(steps.prepare.outputs.proxy-env) }}
      with:
        url: ${{ steps.prepare.outputs.url }}
        method: token
        token: ${{ steps.login.outputs.vault-token }}
        exportEnv: false
        # Defaults of vault-action v4.0.0, set here so that a later version cannot change them:
        # the Vault login token never goes to the environment or to the outputs.
        exportToken: false
        outputToken: false
        secrets: ${{ steps.prepare.outputs.spec }}

    # Runs also when the Vault step failed or the job was cancelled, so that
    # no watchdog stays behind. Fails if the watchdog stopped the Vault step.
    # Warns if the Vault step ran and the watchdog did not find its process.
    - name: Stop time limit for Vault
      id: watchdog_stop
      if: always() && steps.watchdog.outcome == 'success'
      shell: bash
      env:
        WATCHDOG_ID: ${{ steps.watchdog.outputs.id }}
        VAULT_OUTCOME: ${{ steps.vault.outcome }}
        VAULT_TIMEOUT: ${{ steps.prepare.outputs.vault-timeout }}
      run: bash "$GITHUB_ACTION_PATH/watchdog.sh" stop

    # Vault can hold an empty string, and vault-action passes it on without an
    # error. An empty value is always an error here. Names only in the log.
    # Writes output secrets: the vault-action outputs plus the token of the
    # token step under VAULT_SECRETS_GITHUB_TOKEN.
    - name: Check that no value is empty
      id: check
      shell: bash
      env:
        VAULT_OUTPUTS: ${{ toJSON(steps.vault.outputs) }}
        TOKEN_VALUE: ${{ steps.token.outputs.token }}
      run: bash "$GITHUB_ACTION_PATH/check-values.sh"
